<body>
<main>
  <div class="haut">
    <div><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
  </div>
<p class="renvoi" style="margin-bottom:1.5rem">
This runs entirely in your browser — no server, no data leaves your machine. The alert
population is <b>synthetic and seeded</b>; the regulatory deadlines are real and cited.
Every setting below is editable. <a href="https://github.com/ArslaneSempai-ui/alert-triage-economics">Source and method</a>.
</p>

  <div class="chiffres" id="chiffres"></div>
  <div id="recommandation"></div>

  <h2 id="titreHyp"></h2>
  <div id="assumptions"></div>

  <div id="courbe"></div>

  <div id="horizon"></div>

  <p class="renvoi" id="provenanceLegende"></p>
</main>

<script type="module">
import { generatePopulation } from "./js/alerts.js";
import { evaluate, sweep, recommend, ASSUMPTIONS, THRESHOLDS } from "./js/model.js";
import { shadowPrice, cheapestRouteToNextStep } from "./js/shadow.js";
import { plan, costOfTakingTheStep, decisionUnderGrowth, HORIZON } from "./js/plan.js";

const pop = generatePopulation();
let assumptions = { ...ASSUMPTIONS };
let threshold = 0.65;

const BOUNDS = {
  productiveHoursPerDay: [1, 8],
  workingDaysPerYear: [180, 260],
  loadedCostPerAnalyst: [20000, 200000],
  maxHandlingDays: [1, 30],
  analystsInPost: [0, 200],
};

const etat = () => ({
  threshold, assumptions,
  courbe: sweep(pop, THRESHOLDS, assumptions),
  actuel: evaluate(pop, threshold, assumptions),
  recommandation: recommend(pop, THRESHOLDS, assumptions),
  population: { operations: pop.operations, truePositivesTotal: pop.truePositivesTotal },
  bounds: BOUNDS,
});

window.LOCAL = async (chemin, corps) => {
  if (chemin === "/api/etat") return etat();

  if (chemin === "/api/defaut") {
    assumptions = { ...ASSUMPTIONS };
    threshold = 0.65;
    return etat();
  }

  if (chemin === "/api/reglage") {
    if (typeof corps.threshold === "number" && Number.isFinite(corps.threshold)) {
      threshold = Math.min(0.95, Math.max(0.30, corps.threshold));
    }
    for (const [cle, [min, max]] of Object.entries(BOUNDS)) {
      const v = corps[cle];
      if (typeof v === "number" && Number.isFinite(v)) {
        assumptions = { ...assumptions, [cle]: Math.min(max, Math.max(min, v)) };
      }
    }
    return etat();
  }

  if (chemin === "/api/escalier") {
    const horizon = { ...HORIZON, threshold: recommend(pop, THRESHOLDS, assumptions)?.threshold ?? HORIZON.threshold };
    return {
      analyst: shadowPrice("analyst", pop, assumptions),
      routes: cheapestRouteToNextStep(pop, assumptions),
      horizon,
      plan: plan(horizon, assumptions),
      step: costOfTakingTheStep(horizon, assumptions),
      growth: decisionUnderGrowth(undefined, horizon, assumptions),
    };
  }
  return {};
};
</script>
<script type="module">
import { courbe, barres, escalier as marchesG, brancher, choisir } from "./graphes.js";
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
/*
 * One screen, two hosts.
 *
 * Run locally, this talks to the Node server. Published to GitHub Pages there is no
 * server, so the same model runs in the browser and `window.LOCAL` answers the same
 * routes with the same shapes. Keeping one file rather than two means the hosted demo
 * cannot drift from the tool — which is the only way a demo stays worth clicking.
 */
const api = async (chemin, corps) =>
  window.LOCAL ? window.LOCAL(chemin, corps)
    : (await fetch(chemin, corps
        ? { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(corps) } : {})).json();

const T = {
    h1: "The economics of a detection threshold",
    provenance: "Every figure on this page is <b>retrieved</b> from a public source, <b>measured</b> by running the code, <b>assumed</b> because nobody here can know it, or <b>chosen</b> by me. The README says which, one by one.",
    lede: "A detection threshold is analyst hours, headcount and a budget line. This screen converts one into the other.",
    releve: "Operating statement",
    alerts: "alerts per year", hours: "analyst hours", etp: "FTE required",
    cout: "annual cost", attrapes: "true positives caught", rates: "missed",

    seuilTitre: "The detection threshold",
    seuilQuoi: "Lower catches more and costs more. The question is where you start paying without catching.",
    seuilNom: "Detection threshold",

    titreHyp: "Operating assumptions",
    hypQuoi: "All of it is arguable, and all of it is editable.",
    productiveHoursPerDay: "Productive hours per day",
    workingDaysPerYear: "Working days per year",
    loadedCostPerAnalyst: "Loaded cost per analyst ($/yr)",
    maxHandlingDays: "Maximum handling time (days)",
    analystsInPost: "Analysts in post",
    defaut: "Reset to the starting assumptions",

    debordeTitre: "The queue breaks",
    debordeQuoi: (etp, eff) => `This needs ${etp} FTE against ${eff} analysts in post. A queue doesn't run at full occupancy: the backlog stops clearing and the delay runs away. That isn't an overspend, it's a stoppage.`,
    recoTitre: "What the headcount you already pay for allows",
    recoQuoi: (s, vp, av, ap, dorm) =>
      `Going down to <b>${s.toFixed(2)}</b> catches <b>${vp} more true positives</b> for <b>nothing</b>: coverage moves from ${av} to ${ap}. At the tightest threshold, ${dorm} FTE you already pay for sit idle.`,

    titreHorizon: "The quarter the decision is due",
    horizonQuoi: (g, att, sem) => `Everything else on this screen answers about today. At ${g} volume growth a quarter, ${att} annual attrition and ${sem} weeks to fill a req, the decision falls while every indicator is still green.`,
    colTrim: "qtr", colOps: "operations", colBesoin: "heads needed", colTenus: "heads held",
    casse: "breaks", tientH: "holds", tardH: "late",
    marcheTitre: "The step this tool calls free",
    marcheTient: (s1, s2, via, n) => `Going from <b>${s1}</b> to <b>${s2}</b> costs no money this quarter: ${via}. It holds on the ${n} analysts in post across the whole horizon.`,
    marcheCasse: (s1, s2, via, n, quand, combien, fin, dernier, quandDec) => `Going from <b>${s1}</b> to <b>${s2}</b> costs no money this quarter: ${via}. It holds on the ${n} analysts in post until <b>${quand}</b>, when it needs ${combien} more — ${fin} more by ${dernier}. Which puts the req at <b>${quandDec}</b>.`,
    croissanceTitre: "Nobody can hand you next year's growth rate",
    colCroissance: "growth / qtr", colCasse: "queue fails", colDecision: "first decision due",
    horsHorizon: "not on this horizon", rienADecider: "nothing to decide",
    trimPasse: (n) => `${n} quarter${n > 1 ? "s" : ""} ago`,
    titreEscalier: "What the next analyst buys",
    escalierQuoi: "The resource is bought in steps. Funding part of a step buys nothing — not less, nothing.",
    colAjoutes: "added", colLargeur: "step width", colCouverture: "coverage",
    colPaie: "payroll", colAchete: "what the step bought",
    aujourdhui: "today", chacun: "each", cas: "cases",
    mort: (n) => `The longest run that buys <b>nothing at all</b> is ${n} analysts wide.`,
    quantite: (res, n) => res === "productiveHour"
      ? (n * 60 % 60 === 0 ? `${n} more productive hour${n > 1 ? "s" : ""} a day` : `${Math.round(n * 60)} more productive minutes a day`)
      : res === "handlingDay" ? `${n} more day${n > 1 ? "s" : ""} of handling time`
      : `${n} more analyst${n > 1 ? "s" : ""}`,
    routesTitre: "The same step, priced three ways",
    routesQuoi: (s, vp) => `Going down to ${s} finds <b>${vp} more reportable cases a year</b>. Three ways to get there:`,
    gratos: "free", nonChiffre: "not priced here", parAn: "a year",
    marge: (o, c, mur, m) => `"Free" is a budget line, not a risk position. The queue settles at ${o} working days — <b>${c} calendar days</b>, the unit 31 CFR 1020.320(b)(3) counts in — against a ${mur}-day wall. That leaves ${m} days of margin, and margin is what absorbs a holiday period or a resignation.`,
    calcul: "computing…",
    titreCourbe: "What each notch costs",
    colSeuil: "threshold", colAlertes: "alerts", colHeures: "hours", colEtp: "FTE",
    colRecrut: "to hire", colCout: "annual cost", colAttrapes: "caught",
    colRates: "missed", colMarginal: "cost of the next TP", colFile: "queue",
    gratuit: "free", aucunGain: "no gain", tient: "holds", deborde: "breaks",
    jour: "d",
    enRetard: "late",
    colAttente: "wait", colCharge: "occupancy",
    delaiRateTitre: "The promised deadline is missed",
    delaiRateQuoi: (a, d, c) => `The backlog clears, but the average wait reaches ${a} days against a promised ${d}. At ${c} occupancy, one absence is enough to lose the team.`,
    courbeQuoi: "The cost of the next true positive stays at zero, then explodes — long before the total cost looks unreasonable.",
    figCoutTitre: "The cost of the next true positive, notch by notch",
    figCoutAria: "Step chart: across the strictest notches the next true positive costs nothing, then the cost jumps to tens of thousands of dollars on the last two.",
    figEchangeTitre: "What you catch against what it costs",
    figEchangeAria: "Two curves against the threshold: true positives caught rise then saturate, while annual cost stays flat for a long time then takes off.",
    figFileTitre: "The queue",
    figFileAria: "Wait stays under a day while load is far from 1, then diverges; past a load of 1 the queue never clears and the curve breaks off.",
    figMarchesTitre: "How many analysts you must fund before anything changes",
    figMarchesAria: "Bars: each step gets wider while the number of cases gained falls.",
    figPlanTitre: "Need against headcount held, quarter by quarter",
    figPlanAria: "Need climbs in steps with volume while headcount in post erodes; the gap closes quarter after quarter.",
    serAttrapes: "True positives caught", serCout: "Annual cost",
    serAttente: "Mean wait", serCharge: "Queue load",
    serBesoin: "FTE needed", serTenus: "Headcount in post",
    bandeDeborde: "past deadline or queue overflows", seuilUn: "load = 1",
    iciRepere: "current setting", analystes: "analysts",
    tableauDetail: "The detail, threshold by threshold",
    tableauDetailH: "The detail, quarter by quarter",
    analyste: "analyst",
    marcheNom: (de, a) => `threshold ${de} → ${a}`,
    gagnes: (n) => `+${n} cases`,
    contexte: (ops, vp) => `${ops} operations over the year, ${vp} true positives to find. Synthetic data.`,
};

const t = () => T;
let etat = null, occupe = false;
let escalier = null;

const loc = () => "en-GB";
const nb = (n) => Math.round(n).toLocaleString(loc());
/*
 * Money is formatted in one place regardless of the interface language.
 *
 * `nb()` follows the reader's locale, which is right for counts and wrong for currency:
 * the French page was printing "$496 000", an American symbol on a French grouping. The
 * amounts here are dollars because the regulations behind the model are American, and a
 * dollar figure reads the same way to everyone who deals in dollars.
 */
const dollars = (n) => "$" + Math.round(n).toLocaleString("en-GB");
/* Sur un axe, « $496,000 » écrase le cran voisin. La forme longue reste dans l'info-bulle. */
const dollarsCourt = (n) => {
  const v = Math.abs(n);
  if (v >= 1e6) return "$" + (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (v >= 1000) return "$" + Math.round(n / 1000) + "k";
  return "$" + Math.round(n);
};

/*
 * A number typed by a human, read tolerantly.
 *
 * `<input type="number">` renders its value through the browser's locale, so 2.4 appeared
 * as "2,4" on an English page — a visible inconsistency on a screen whose whole argument is
 * that its figures are trustworthy. These are text fields now, and both separators are
 * accepted because both are what people type.
 */
const lire = (v) => Number(String(v).replace(/\s/g, "").replace(",", "."));
const pc = (x) => (x * 100).toFixed(0) + " %";

function blocChiffres() {
  const L = t(), a = etat.actuel;
  const cases = [
    { v: nb(a.alerts), l: L.alerts },
    { v: nb(a.hours), l: L.hours },
    { v: a.fteWhole, l: L.etp, mauvais: !a.queueHolds },
    { v: dollars(a.annualCost), l: L.cout },
    { v: nb(a.truePositivesCaught), l: L.attrapes },
    { v: nb(a.truePositivesMissed), l: L.rates },
  ];
  /*
   * Le coût annuel est le total : il découle des alertes, des heures et des ETP posés
   * au-dessus de lui. Six tuiles côte à côte ne montraient aucune de ces dépendances.
   */
  const ordre = [cases[0], cases[1], cases[2], cases[4], cases[5]];
  const total = cases[3];
  $("#chiffres").innerHTML = `<section class="feuillet">
    <div class="intitule">${esc(L.releve)}</div>
    <div class="corps">
      ${ordre.map((c) => `<div class="ligne">
        <span class="intitule">${esc(c.l)}</span>
        <span class="valeur${c.mauvais ? " defavorable" : ""}">${esc(c.v)}</span></div>`).join("")}
      <div class="ligne total"><span class="intitule">${esc(total.l)}</span>
        <span class="valeur">${esc(total.v)}</span></div>
    </div></section>`;
}

function blocRecommandation() {
  const L = t(), a = etat.actuel, r = etat.recommandation;
  let html = "";
  if (!a.queueHolds) {
    html += `<div class="renvoi defavorable"><b>${esc(L.debordeTitre)}</b><br>
      ${esc(L.debordeQuoi(a.fteWhole, etat.assumptions.analystsInPost))}</div>`;
  } else if (!a.deadlineMet) {
    html += `<div class="renvoi defavorable"><b>${esc(L.delaiRateTitre)}</b><br>
      ${esc(L.delaiRateQuoi(a.waitDays.toFixed(1), etat.assumptions.maxHandlingDays, a.load === null ? "—" : pc(a.load)))}</div>`;
  }
  if (r && r.truePositivesGained > 0 && r.threshold < etat.threshold) {
    html += `<div class="renvoi favorable"><b>${esc(L.recoTitre)}</b><br>
      ${L.recoQuoi(r.threshold, r.truePositivesGained, pc(r.coverageBefore), pc(r.coverageAfter), r.idleCapacity)}</div>`;
  }
  $("#recommandation").innerHTML = html;
}

function blocHypotheses() {
  const L = t();
  $("#titreHyp").textContent = L.titreHyp;
  const champs = Object.keys(etat.bounds).map((cle) => {
    const [min, max] = etat.bounds[cle];
    return `<div><label for="${cle}">${esc(L[cle])}</label>
      <input type="text" inputmode="decimal" id="${cle}" value="${etat.assumptions[cle]}" data-min="${min}" data-max="${max}" /></div>`;
  }).join("");
  $("#assumptions").innerHTML = `<div class="feuillet"><div class="quoi">${esc(L.hypQuoi)}</div>
    <div class="grille">${champs}</div>
    <button class="b remise" id="defaut" type="button">${esc(L.defaut)}</button></div>`;

  for (const cle of Object.keys(etat.bounds)) {
    $(`#${cle}`).onchange = (e) => envoyer({ [cle]: lire(e.target.value) });
  }
  $("#defaut").onclick = () => envoyer(null, "/api/defaut");
}

function blocCourbe() {
  const L = t();
  $("#titreCourbe").textContent = L.titreCourbe;
  const pts = [...etat.courbe].sort((a, b) => a.threshold - b.threshold);
  const lignes = etat.courbe.map((p) => {
    const m = p.costPerMarginalTruePositive;
    const marginal = m === null ? "—"
      : m === 0 ? `<span class="gratuit">${esc(L.gratuit)}</span>`
      : m === null || !isFinite(m) ? esc(L.aucunGain)
      : dollars(m);
    return `<tr class="${Math.abs(p.threshold - etat.threshold) < 0.001 ? "ici " : ""}${p.queueHolds && p.deadlineMet ? "" : "deborde"}">
      <td>${p.threshold.toFixed(2)}</td><td>${nb(p.alerts)}</td><td>${nb(p.hours)}</td>
      <td>${p.fteWhole}</td><td>${p.hires || "—"}</td><td>${dollars(p.annualCost)}</td>
      <td>${nb(p.truePositivesCaught)}</td><td>${nb(p.truePositivesMissed)}</td>
      <td>${marginal}</td>
      <td>${p.load === null ? "—" : pc(p.load)}</td>
      <td>${p.waitDays === null ? "—" : p.waitDays.toFixed(1) + " " + L.jour}</td>
      <td>${esc(!p.queueHolds ? L.deborde : p.deadlineMet ? L.tient : L.enRetard)}</td></tr>`;
  }).join("");

  /*
   * Les seuils disqualifiés, en une bande plutôt qu'en douze cellules rouges.
   *
   * Un seuil où la file ne se vide pas, ou où le délai réglementaire est manqué, n'est pas
   * un point de la courbe qu'on pourrait choisir : c'est une zone interdite. Les bornes
   * tombent à mi-chemin des seuils voisins — le modèle n'a pas mesuré entre les deux, et
   * faire courir la bande jusqu'au seuil suivant prétendrait le contraire.
   */
  const bandes = [];
  pts.forEach((p, i) => {
    if (p.queueHolds && p.deadlineMet) return;
    const de = i === 0 ? p.threshold : (pts[i - 1].threshold + p.threshold) / 2;
    const a = i === pts.length - 1 ? p.threshold : (p.threshold + pts[i + 1].threshold) / 2;
    const prec = bandes[bandes.length - 1];
    if (prec && Math.abs(prec.a - de) < 1e-9) prec.a = a;
    else bandes.push({ de, a, nom: bandes.length ? "" : L.bandeDeborde });
  });

  /* Le coût marginal porté par un cran vaut le passage depuis le seuil immédiatement plus
   * strict : la marche couvre donc l'intervalle entre les deux, pas le point. */
  const marches = pts.slice(0, -1).map((p, i) => {
    const m = p.costPerMarginalTruePositive;
    return {
      de: p.threshold, a: pts[i + 1].threshold,
      valeur: Number.isFinite(m) ? m : 0,
      gratuite: m === 0, morte: !Number.isFinite(m),
      ici: Math.abs(p.threshold - etat.threshold) < 0.001,
    };
  });

  /*
   * Le réglage le plus strict a droit à sa marche.
   *
   * Son coût marginal n'existe pas — rien de plus strict n'a été mesuré, donc il n'y a
   * aucun passage à facturer. L'omettre le rendait injoignable depuis la figure alors que
   * le modèle l'accepte. Il est là, à hauteur nulle et marqué comme non chiffré : c'est un
   * réglage qu'on peut prendre, pas un prix qu'on connaît.
   */
  const dernier = pts[pts.length - 1], avant = pts[pts.length - 2];
  if (dernier && avant) {
    marches.push({
      de: dernier.threshold, a: dernier.threshold + (dernier.threshold - avant.threshold),
      valeur: 0, morte: true,
      ici: Math.abs(dernier.threshold - etat.threshold) < 0.001,
    });
  }

  const repere = { x: etat.threshold, texte: L.iciRepere };
  const fmtSeuil = (v) => v.toFixed(2);

  /*
   * L'escalier est la commande.
   *
   * C'était un curseur, deux blocs plus haut, qui réglait un seuil dont le prix se lisait
   * ici. Or ce prix *est* la question : on ne choisit pas « 0,65 », on choisit de payer
   * 32 476 $ le vrai positif suivant. Le lecteur pose donc la main sur la marche dont il
   * accepte le prix, et le reste de l'écran s'aligne dessus.
   *
   * Un choix par marche, pas une ligne qu'on tire : le modèle a mesuré treize seuils et
   * rien entre deux. Une position continue promettrait une précision que personne n'a.
   */
  const figCout = marchesG({ marches, fmt: dollarsCourt, fmtX: fmtSeuil, hauteur: 200,
    aria: L.figCoutAria, choix: true, iciTexte: L.iciRepere });

  const figEchange = courbe({
    points: pts, x: (p) => p.threshold, marque: repere, bandes, fmtX: fmtSeuil,
    hauteur: 240, aria: L.figEchangeAria,
    series: [
      { cle: (p) => p.truePositivesCaught, nom: L.serAttrapes, aire: true, fmt: nb },
      { cle: (p) => p.annualCost, nom: L.serCout, ton: "neutre", fmt: dollars, fmtCran: dollarsCourt },
    ],
  });

  const figFile = courbe({
    points: pts, x: (p) => p.threshold, marque: repere, bandes, fmtX: fmtSeuil,
    hauteur: 220, aria: L.figFileAria,
    seuils: [{ y: 1, serie: 1, texte: L.seuilUn }],
    series: [
      { cle: (p) => p.waitDays, nom: L.serAttente, aire: true,
        fmt: (v) => v.toFixed(1) + " " + L.jour, fmtCran: (v) => v.toFixed(1) },
      { cle: (p) => p.load, nom: L.serCharge, ton: "neutre", fmt: pc, fmtCran: (v) => v.toFixed(1) },
    ],
  });

  $("#courbe").innerHTML = `<div class="feuillet">
    <div class="titre">${esc(L.seuilTitre)}</div>
    <div class="quoi">${esc(L.seuilQuoi)} ${esc(L.courbeQuoi)}</div>
    <div class="titre-fig">${esc(L.figCoutTitre)}</div>${figCout}
    <div class="titre-fig">${esc(L.figEchangeTitre)}</div>${figEchange}
    <div class="titre-fig">${esc(L.figFileTitre)}</div>${figFile}
    <details><summary>${esc(L.tableauDetail)}</summary>
    <div class="defile"><table><thead><tr>
      <th>${esc(L.colSeuil)}</th><th>${esc(L.colAlertes)}</th><th>${esc(L.colHeures)}</th>
      <th>${esc(L.colEtp)}</th><th>${esc(L.colRecrut)}</th><th>${esc(L.colCout)}</th>
      <th>${esc(L.colAttrapes)}</th><th>${esc(L.colRates)}</th><th>${esc(L.colMarginal)}</th>
      <th>${esc(L.colCharge)}</th><th>${esc(L.colAttente)}</th><th>${esc(L.colFile)}</th></tr></thead>
      <tbody>${lignes}</tbody></table></div></details>
    <div class="renvoi">${esc(L.contexte(nb(etat.population.operations), etat.population.truePositivesTotal))}</div>
  </div>`;
  brancher($("#courbe"));
  choisir($("#courbe"), (v) => envoyer({ threshold: Number(v) }), etat.threshold);
}

/*
 * The staircase.
 *
 * It arrives after the rest of the page because it takes about a second to compute, and a
 * screen that stalls while someone types in the assumptions panel is a screen they stop
 * believing. Until it lands the section says so rather than sitting empty — an empty block
 * where a table is about to appear reads as a bug.
 */
function blocEscalier() {
  const L = t();
  $("#titreEscalier").textContent = L.titreEscalier;

  if (!escalier) {
    $("#escalier").innerHTML = `<div class="feuillet"><div class="quoi">${esc(L.escalierQuoi)}</div>
      <div class="renvoi">${esc(L.calcul)}</div></div>`;
    return;
  }

  const lignes = escalier.analyst.rungs.map((r) => `<tr${r.width === 0 ? ' class="ici"' : ""}>
    <td>${r.units === 0 ? esc(L.aujourdhui) : "+" + r.units}</td>
    <td>${r.width === 0 ? "—" : "+" + r.width}</td>
    <td>${r.threshold.toFixed(2)}</td>
    <td>${nb(r.truePositives)}</td><td>${pc(r.coverage)}</td><td>${dollars(r.annualCost)}</td>
    <td>${r.width === 0 ? "—"
      : `+${r.gained} ${esc(L.cas)}` + (r.perTruePositive === null ? "" : ` · <b>${dollars(r.perTruePositive)}</b> ${esc(L.chacun)}`)}</td>
  </tr>`).join("");

  const routes = escalier.routes;
  const bloc2 = !routes ? "" : `<section class="feuillet"><div class="corps">
    <div class="titre">${esc(L.routesTitre)}</div>
    <div class="quoi">${L.routesQuoi(routes.threshold.toFixed(2), routes.gained)}</div>
    <table><tbody>${routes.routes.map((r) => `<tr><td>${esc(L.quantite(r.resource, r.units))}</td>
      <td class="chiffre">${r.cost === null ? esc(L.nonChiffre)
        : r.cost === 0 ? `<span class="gratuit">${esc(L.gratos)}</span>`
        : dollars(r.cost) + " " + esc(L.parAn)}</td></tr>`).join("")}</tbody></table>
    ${routes.deadlineCost ? `<div class="renvoi">${L.marge(
      routes.deadlineCost.waitWorkingDays.toFixed(1),
      routes.deadlineCost.waitCalendarDays.toFixed(1),
      routes.deadlineCost.wallCalendarDays,
      routes.deadlineCost.marginCalendarDays.toFixed(1))}</div>` : ""}
  </div></section>`;

  /* Ce que le tableau ne montre pas d'un coup d'œil : la marche s'élargit — un analyste,
   * puis dix, puis dix-huit — pendant que ce qu'elle achète se réduit. */
  const crans = escalier.analyst.rungs;
  const figMarches = barres({
    items: crans.slice(1).map((r, i) => ({
      nom: L.marcheNom(crans[i].threshold.toFixed(2), r.threshold.toFixed(2)),
      valeur: r.width, ton: "accent",
      note: L.gagnes(r.gained) + (r.perTruePositive === null ? "" : " · " + dollars(r.perTruePositive) + " " + L.chacun),
    })),
    fmt: (v) => v + " " + (v > 1 ? L.analystes : L.analyste),
    aria: L.figMarchesAria,
  });

  $("#escalier").innerHTML = `<div class="feuillet">
    <div class="quoi">${esc(L.escalierQuoi)}</div>
    <div class="titre-fig">${esc(L.figMarchesTitre)}</div>${figMarches}
    <div class="defile"><table><thead><tr>
      <th>${esc(L.colAjoutes)}</th><th>${esc(L.colLargeur)}</th><th>${esc(L.colSeuil)}</th>
      <th>${esc(L.colAttrapes)}</th><th>${esc(L.colCouverture)}</th><th>${esc(L.colPaie)}</th>
      <th>${esc(L.colAchete)}</th></tr></thead><tbody>${lignes}</tbody></table></div>
    <div class="renvoi">${L.mort(escalier.analyst.widestDeadZone)}</div>
  </div>${bloc2}`;
}

function blocHorizon() {
  const L = t();
  $("#titreHorizon").textContent = L.titreHorizon;

  if (!escalier) {
    $("#horizon").innerHTML = `<div class="feuillet"><div class="renvoi">${esc(L.calcul)}</div></div>`;
    return;
  }

  const h = escalier.horizon, p = escalier.plan;
  const q = (i) => (i < 0 ? L.trimPasse(-i) : "Q" + (i + 1));

  const lignes = p.quarters.map((x) => `<tr class="${x.queueHolds && x.deadlineMet ? "" : "deborde"}">
    <td>${esc(x.label)}</td><td>${nb(x.operations)}</td><td>${nb(x.alerts)}</td>
    <td>${x.fteNeeded}</td><td>${x.headcount.toFixed(1)}</td>
    <td>${x.load === null ? "—" : pc(x.load)}</td>
    <td>${x.waitDays === null ? "—" : x.waitDays.toFixed(1) + " " + L.jour}</td>
    <td>${esc(!x.queueHolds ? L.casse : x.deadlineMet ? L.tientH : L.tardH)}</td></tr>`).join("");

  const st = escalier.step;
  const via = st && st.via ? L.quantite(st.via.resource, st.via.units) : "";
  const blocStep = !st ? "" : `<section class="feuillet"><div class="corps">
    <div class="titre">${esc(L.marcheTitre)}</div>
    <div class="quoi">${st.freeUntil === null || st.decideBy === null
      ? L.marcheTient(st.from.toFixed(2), st.to.toFixed(2), via, escalier.plan.quarters[0].headcount.toFixed(0))
      : L.marcheCasse(st.from.toFixed(2), st.to.toFixed(2), via, escalier.plan.quarters[0].headcount.toFixed(0),
          q(st.freeUntil), st.extraWhenItBites, st.extraByHorizon, q(p.quarters.length - 1), q(st.decideBy))}</div>
  </div></section>`;

  const croissance = escalier.growth.map((r) => `<tr><td>${(r.growth * 100).toFixed(0)} %</td>
    <td>${r.breaksAt === null ? esc(L.horsHorizon) : q(r.breaksAt)}</td>
    <td>${r.decideBy === null ? esc(L.rienADecider) : q(r.decideBy)}</td></tr>`).join("");

  /* Les deux séries sont des personnes : elles partagent l'axe. Sur deux axes séparés on
   * pourrait faire dire n'importe quoi à l'écart, et l'écart est tout le sujet. */
  const dernier = p.quarters.length - 1;
  const dans = (i) => typeof i === "number" && i >= 0 && i <= dernier;
  const figPlan = courbe({
    points: p.quarters, x: (x) => x.index, hauteur: 230, aria: L.figPlanAria,
    fmtX: (v) => "Q" + (v + 1),
    series: [
      { cle: (x) => x.fteNeeded, nom: L.serBesoin, aire: true, fmt: (v) => v.toFixed(0) },
      { cle: (x) => x.headcount, nom: L.serTenus, partage: true, ton: "neutre", fmt: (v) => v.toFixed(1) },
    ],
    bandes: dans(p.breaksAt) ? [{ de: p.breaksAt - 0.5, a: dernier, nom: L.casse }] : [],
    marque: dans(p.decideBy) ? { x: p.decideBy, texte: L.colDecision } : undefined,
  });

  $("#horizon").innerHTML = `<div class="feuillet">
    <div class="quoi">${esc(L.horizonQuoi((h.quarterlyGrowth * 100).toFixed(0) + " %",
      (h.attritionPerYear * 100).toFixed(0) + " %", h.hiringLeadWeeks))}</div>
    <div class="titre-fig">${esc(L.figPlanTitre)}</div>${figPlan}
    <details><summary>${esc(L.tableauDetailH)}</summary>
    <div class="defile"><table><thead><tr>
      <th>${esc(L.colTrim)}</th><th>${esc(L.colOps)}</th><th>${esc(L.colAlertes)}</th>
      <th>${esc(L.colBesoin)}</th><th>${esc(L.colTenus)}</th><th>${esc(L.colCharge)}</th>
      <th>${esc(L.colAttente)}</th><th>${esc(L.colFile)}</th></tr></thead><tbody>${lignes}</tbody></table></div></details>
  </div>${blocStep}
  <section class="feuillet"><div class="corps">
    <div class="titre">${esc(L.croissanceTitre)}</div>
    <table><thead><tr><th>${esc(L.colCroissance)}</th><th>${esc(L.colCasse)}</th>
      <th>${esc(L.colDecision)}</th></tr></thead><tbody>${croissance}</tbody></table>
  </div></section>`;
}

function dessiner() {
  const L = t();
  $("#h1").textContent = L.h1;
  $("#provenanceLegende").innerHTML = L.provenance;
  $("#lede").textContent = L.lede;
  blocChiffres(); blocRecommandation(); blocHypotheses(); blocCourbe(); blocEscalier(); blocHorizon();
  brancher();
}

/*
 * Fetching it separately means two answers can be in flight at once and the slower one
 * can land last, painting a staircase for assumptions the user has already changed. Each
 * request carries a ticket; only the newest one is allowed to draw.
 */
let billet = 0;
async function chargerEscalier() {
  const mien = ++billet;
  escalier = null;
  blocEscalier(); blocHorizon();
  const recu = await api("/api/escalier");
  if (mien !== billet) return;
  escalier = recu;
  blocEscalier(); blocHorizon();
  brancher();
}

/*
 * Un envoi à la fois, aucun geste perdu, et l'escalier qui attend.
 *
 * Passer la main sur les marches enchaîne les choix ; jeter ceux qui arrivent pendant un
 * appel laisserait l'écran sur un état antérieur à la main. On garde donc le dernier et on
 * le part dès que la place est libre. L'escalier de capacité, lui, coûte une seconde de
 * calcul : le relancer à chaque marche traversée n'apprendrait rien à personne, il part
 * quand la main s'est arrêtée.
 */
let enAttente = null, minuterieEscalier = 0;
async function envoyer(corps, chemin = "/api/reglage") {
  if (occupe) { enAttente = [corps, chemin]; return; }
  occupe = true;
  try {
    etat = await api(chemin, corps ?? {});
    dessiner();
    clearTimeout(minuterieEscalier);
    minuterieEscalier = setTimeout(chargerEscalier, 260);
  } finally {
    occupe = false;
    if (enAttente) { const suite = enAttente; enAttente = null; envoyer(...suite); }
  }
}

etat = await api("/api/etat");
dessiner();
chargerEscalier();
</script>
