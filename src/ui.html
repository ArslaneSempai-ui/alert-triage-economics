<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Économie du seuil de détection</title>
<link rel="stylesheet" href="/registre.css" />
</head>
<body>
<main>
  <div class="haut">
    <div><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
    <div class="lang"><button id="fr" type="button">FR</button><button id="en" type="button">EN</button></div>
  </div>

  <div class="chiffres" id="chiffres"></div>
  <div id="recommandation"></div>
  <div id="reglage"></div>

  <h2 id="titreHyp"></h2>
  <div id="hypotheses"></div>

  <h2 id="titreCourbe"></h2>
  <div id="courbe"></div>
</main>

<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const api = async (chemin, corps) => (await fetch(chemin, corps
  ? { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(corps) } : {})).json();

const T = {
  fr: {
    h1: "Économie du seuil de détection",
    lede: "Un seuil de surveillance transactionnelle n'est pas un réglage technique : c'est des heures d'analystes, un effectif et une ligne budgétaire, en face de ce qu'on attrape. Cet écran traduit l'un dans l'autre.",
    releve: "Relevé d'exploitation",
    alertes: "alertes par an", heures: "heures d'analystes", etp: "ETP nécessaires",
    cout: "coût annuel", attrapes: "vrais positifs attrapés", rates: "manqués",

    seuilTitre: "Le seuil de détection",
    seuilQuoi: "Plus bas, plus d'alertes : on attrape davantage et on paie davantage. Toute la question est de savoir à partir de quand on paie sans attraper.",
    strict: "strict — peu d'alertes", large: "large — beaucoup d'alertes",
    seuilNom: "Seuil de détection",

    titreHyp: "Les hypothèses d'exploitation",
    hypQuoi: "Tout est discutable et tout se modifie. Un modèle dont on ne peut pas contester les hypothèses n'est pas un modèle, c'est une opinion présentée en tableau.",
    heuresProductivesParJour: "Heures productives par jour",
    joursTravaillesParAn: "Jours travaillés par an",
    coutChargeParAnalyste: "Coût chargé par analyste (€/an)",
    delaiMaxJours: "Délai maximal de traitement (jours)",
    effectifActuel: "Analystes en poste",
    defaut: "Revenir aux hypothèses de départ",

    debordeTitre: "La file déborde",
    debordeQuoi: (etp, eff) => `Il faudrait ${etp} ETP pour ${eff} analystes en poste. Une file ne tourne pas à pleine occupation : le stock ne se résorbe plus, et le délai part à l'infini. Ce n'est pas un surcoût, c'est un arrêt.`,
    recoTitre: "Ce que l'effectif déjà payé permet",
    recoQuoi: (s, vp, av, ap, dorm) =>
      `Descendre à <b>${s.toFixed(2)}</b> attrape <b>${vp} vrais positifs de plus</b> pour <b>zéro euro</b> : la couverture passe de ${av} à ${ap}. Au seuil le plus strict, ${dorm} ETP déjà payés ne servent à rien.`,

    titreCourbe: "Ce que coûte chaque cran",
    colSeuil: "seuil", colAlertes: "alertes", colHeures: "heures", colEtp: "ETP",
    colRecrut: "à recruter", colCout: "coût annuel", colAttrapes: "attrapés",
    colRates: "manqués", colMarginal: "coût du VP suivant", colFile: "file",
    gratuit: "gratuit", aucunGain: "aucun gain", tient: "tient", deborde: "déborde",
    enRetard: "hors délai",
    colAttente: "attente", colCharge: "occupation",
    delaiRateTitre: "Le délai promis n'est pas tenu",
    delaiRateQuoi: (a, d, c) => `La file se résorbe, mais l'attente moyenne atteint ${a} jours pour un délai promis de ${d}. À ${c} d'occupation, la moindre absence fait décrocher l'équipe.`,
    courbeQuoi: "Le coût du vrai positif suivant est le chiffre qui décide. Il reste nul tant qu'on occupe des gens déjà payés, puis il explose — bien avant que le coût total ne paraisse déraisonnable.",
    contexte: (ops, vp) => `${ops} opérations sur l'année, ${vp} vrais positifs à trouver. Données synthétiques.`,
  },
  en: {
    h1: "The economics of a detection threshold",
    lede: "A transaction-monitoring threshold isn't a technical setting: it's analyst hours, headcount and a budget line, set against what you catch. This screen converts one into the other.",
    releve: "Operating statement",
    alertes: "alerts per year", heures: "analyst hours", etp: "FTE required",
    cout: "annual cost", attrapes: "true positives caught", rates: "missed",

    seuilTitre: "The detection threshold",
    seuilQuoi: "Lower means more alerts: you catch more and you pay more. The whole question is where you start paying without catching.",
    strict: "tight — few alerts", large: "loose — many alerts",
    seuilNom: "Detection threshold",

    titreHyp: "Operating assumptions",
    hypQuoi: "All of it is arguable and all of it is editable. A model whose assumptions you can't challenge isn't a model — it's an opinion in a table.",
    heuresProductivesParJour: "Productive hours per day",
    joursTravaillesParAn: "Working days per year",
    coutChargeParAnalyste: "Loaded cost per analyst (€/yr)",
    delaiMaxJours: "Maximum handling time (days)",
    effectifActuel: "Analysts in post",
    defaut: "Reset to the starting assumptions",

    debordeTitre: "The queue breaks",
    debordeQuoi: (etp, eff) => `This needs ${etp} FTE against ${eff} analysts in post. A queue doesn't run at full occupancy: the backlog stops clearing and the delay runs away. That isn't an overspend, it's a stoppage.`,
    recoTitre: "What the headcount you already pay for allows",
    recoQuoi: (s, vp, av, ap, dorm) =>
      `Going down to <b>${s.toFixed(2)}</b> catches <b>${vp} more true positives</b> for <b>nothing</b>: coverage moves from ${av} to ${ap}. At the tightest threshold, ${dorm} FTE you already pay for sit idle.`,

    titreCourbe: "What each notch costs",
    colSeuil: "threshold", colAlertes: "alerts", colHeures: "hours", colEtp: "FTE",
    colRecrut: "to hire", colCout: "annual cost", colAttrapes: "caught",
    colRates: "missed", colMarginal: "cost of the next TP", colFile: "queue",
    gratuit: "free", aucunGain: "no gain", tient: "holds", deborde: "breaks",
    enRetard: "late",
    colAttente: "wait", colCharge: "occupancy",
    delaiRateTitre: "The promised deadline is missed",
    delaiRateQuoi: (a, d, c) => `The backlog clears, but the average wait reaches ${a} days against a promised ${d}. At ${c} occupancy, one absence is enough to lose the team.`,
    courbeQuoi: "The cost of the next true positive is the number that decides. It stays at zero while you're using people you already pay, then it explodes — long before the total cost looks unreasonable.",
    contexte: (ops, vp) => `${ops} operations over the year, ${vp} true positives to find. Synthetic data.`,
  },
};

let langue = localStorage.getItem("langue") === "en" ? "en" : "fr";
const t = () => T[langue];
let etat = null, occupe = false;

const loc = () => (langue === "fr" ? "fr-FR" : "en-GB");
const nb = (n) => Math.round(n).toLocaleString(loc());
const euro = (n) => "€" + nb(n);
const pc = (x) => (x * 100).toFixed(0) + " %";

function blocChiffres() {
  const L = t(), a = etat.actuel;
  const cases = [
    { v: nb(a.alertes), l: L.alertes },
    { v: nb(a.heures), l: L.heures },
    { v: a.etpEntiers, l: L.etp, mauvais: !a.fileTient },
    { v: euro(a.coutAnnuel), l: L.cout },
    { v: nb(a.vraisPositifsAttrapes), l: L.attrapes },
    { v: nb(a.vraisPositifsManques), l: L.rates },
  ];
  /*
   * Le coût annuel est le total : il découle des alertes, des heures et des ETP posés
   * au-dessus de lui. Six tuiles côte à côte ne montraient aucune de ces dépendances.
   */
  const ordre = [cases[0], cases[1], cases[2], cases[4], cases[5]];
  const total = cases[3];
  $("#chiffres").innerHTML = `<section class="feuillet">
    <div class="intitule">${esc(L.releve)}</div>
    <div class="corps">
      ${ordre.map((c) => `<div class="ligne">
        <span class="intitule">${esc(c.l)}</span>
        <span class="valeur${c.mauvais ? " defavorable" : ""}">${esc(c.v)}</span></div>`).join("")}
      <div class="ligne total"><span class="intitule">${esc(total.l)}</span>
        <span class="valeur">${esc(total.v)}</span></div>
    </div></section>`;
}

function blocRecommandation() {
  const L = t(), a = etat.actuel, r = etat.recommandation;
  let html = "";
  if (!a.fileTient) {
    html += `<div class="renvoi defavorable"><b>${esc(L.debordeTitre)}</b><br>
      ${esc(L.debordeQuoi(a.etpEntiers, etat.hypotheses.effectifActuel))}</div>`;
  } else if (!a.delaiTenu) {
    html += `<div class="renvoi defavorable"><b>${esc(L.delaiRateTitre)}</b><br>
      ${esc(L.delaiRateQuoi(a.attenteJours.toFixed(1), etat.hypotheses.delaiMaxJours, a.charge === null ? "—" : pc(a.charge)))}</div>`;
  }
  if (r && r.vraisPositifsGagnes > 0 && r.seuil < etat.seuil) {
    html += `<div class="renvoi favorable"><b>${esc(L.recoTitre)}</b><br>
      ${L.recoQuoi(r.seuil, r.vraisPositifsGagnes, pc(r.couvertureAvant), pc(r.couvertureApres), r.capaciteDormante)}</div>`;
  }
  $("#recommandation").innerHTML = html;
}

function blocReglage() {
  const L = t();
  $("#reglage").innerHTML = `<section class="feuillet"><div class="corps">
    <div class="titre">${esc(L.seuilTitre)}</div>
    <div class="quoi">${esc(L.seuilQuoi)}</div>
    <div class="rang">
      <span class="bout">${esc(L.large)}</span>
      <input type="range" id="seuil" min="0.30" max="0.95" step="0.05" value="${etat.seuil}"
        aria-label="${esc(L.seuilNom)}" />
      <span class="bout">${esc(L.strict)}</span>
      <span class="lecture" id="seuilVal">${etat.seuil.toFixed(2)}</span>
    </div></div></section>`;
  const s = $("#seuil");
  s.oninput = () => { $("#seuilVal").textContent = Number(s.value).toFixed(2); };
  s.onchange = () => envoyer({ seuil: Number(s.value) });
}

function blocHypotheses() {
  const L = t();
  $("#titreHyp").textContent = L.titreHyp;
  const champs = Object.keys(etat.bornes).map((cle) => {
    const [min, max] = etat.bornes[cle];
    return `<div><label for="${cle}">${esc(L[cle])}</label>
      <input type="number" id="${cle}" value="${etat.hypotheses[cle]}" min="${min}" max="${max}" /></div>`;
  }).join("");
  $("#hypotheses").innerHTML = `<div class="feuillet"><div class="quoi">${esc(L.hypQuoi)}</div>
    <div class="grille">${champs}</div>
    <button class="b" id="defaut" type="button">${esc(L.defaut)}</button></div>`;

  for (const cle of Object.keys(etat.bornes)) {
    $(`#${cle}`).onchange = (e) => envoyer({ [cle]: Number(e.target.value) });
  }
  $("#defaut").onclick = () => envoyer(null, "/api/defaut");
}

function blocCourbe() {
  const L = t();
  $("#titreCourbe").textContent = L.titreCourbe;
  const lignes = etat.courbe.map((p) => {
    const m = p.coutMarginalParVraiPositif;
    const marginal = m === null ? "—"
      : m === 0 ? `<span class="gratuit">${esc(L.gratuit)}</span>`
      : m === null || !isFinite(m) ? esc(L.aucunGain)
      : euro(m);
    return `<tr class="${Math.abs(p.seuil - etat.seuil) < 0.001 ? "ici " : ""}${p.fileTient && p.delaiTenu ? "" : "deborde"}">
      <td>${p.seuil.toFixed(2)}</td><td>${nb(p.alertes)}</td><td>${nb(p.heures)}</td>
      <td>${p.etpEntiers}</td><td>${p.recrutements || "—"}</td><td>${euro(p.coutAnnuel)}</td>
      <td>${nb(p.vraisPositifsAttrapes)}</td><td>${nb(p.vraisPositifsManques)}</td>
      <td>${marginal}</td>
      <td>${p.charge === null ? "—" : pc(p.charge)}</td>
      <td>${p.attenteJours === null ? "—" : p.attenteJours.toFixed(1) + " j"}</td>
      <td>${esc(!p.fileTient ? L.deborde : p.delaiTenu ? L.tient : L.enRetard)}</td></tr>`;
  }).join("");

  $("#courbe").innerHTML = `<div class="feuillet">
    <div class="quoi">${esc(L.courbeQuoi)}</div>
    <div class="defile"><table><thead><tr>
      <th>${esc(L.colSeuil)}</th><th>${esc(L.colAlertes)}</th><th>${esc(L.colHeures)}</th>
      <th>${esc(L.colEtp)}</th><th>${esc(L.colRecrut)}</th><th>${esc(L.colCout)}</th>
      <th>${esc(L.colAttrapes)}</th><th>${esc(L.colRates)}</th><th>${esc(L.colMarginal)}</th>
      <th>${esc(L.colCharge)}</th><th>${esc(L.colAttente)}</th><th>${esc(L.colFile)}</th></tr></thead><tbody>${lignes}</tbody></table></div>
    <div class="renvoi">${esc(L.contexte(nb(etat.population.operations), etat.population.vraisPositifsTotal))}</div>
  </div></section>`;
}

function dessiner() {
  const L = t();
  document.documentElement.lang = langue;
  $("#h1").textContent = L.h1;
  $("#lede").textContent = L.lede;
  $("#fr").className = langue === "fr" ? "on" : "";
  $("#en").className = langue === "en" ? "on" : "";
  blocChiffres(); blocRecommandation(); blocReglage(); blocHypotheses(); blocCourbe();
}

async function envoyer(corps, chemin = "/api/reglage") {
  if (occupe) return;
  occupe = true;
  try { etat = await api(chemin, corps ?? {}); dessiner(); }
  finally { occupe = false; }
}

for (const l of ["fr", "en"]) {
  $(`#${l}`).onclick = () => { langue = l; localStorage.setItem("langue", l); dessiner(); };
}

etat = await api("/api/etat");
dessiner();
</script>
</body>
</html>
